<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0f13;color:#f2efe8;font-family:Montserrat}
.split{position:absolute;inset:0;background:linear-gradient(90deg,#1d3557 0 50%,#6b1d1d 50% 100%);opacity:.55;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}

.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.75) 100%)}
.lbl{position:absolute;top:120px;font:700 30px Oswald;letter-spacing:14px;opacity:.85}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k{font:700 28px Oswald;letter-spacing:12px;color:#e9c46a}
h1{font:400 230px 'Bebas Neue';margin:6px 0 0;line-height:.9;letter-spacing:4px;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.s{font:700 48px Montserrat;letter-spacing:2px}
.y{margin-top:34px;font:400 36px Oswald;letter-spacing:20px;color:#cfc8b8}
</style></head><body>
<div class="split"></div><div class="crack"></div><div class="shade"></div>
<div class="lbl" style="left:180px">NORTH</div><div class="lbl" style="right:180px">SOUTH</div>
<div class="c"><div class="k">U.S. HISTORY 1301</div><h1>SECTIONALISM</h1><div class="s">AND THE COMING OF THE CIVIL WAR</div><div class="y">1848 · 1861</div></div>
</body></html>
