plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Tough As Nails and GlitchCore are published here by the Glitchfiend team.
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/releases'
    }
    // Fallback: drop ToughAsNails-neoforge-*.jar and GlitchCore-neoforge-*.jar in ./libs
    flatDir { dirs 'libs' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Tough As Nails (HARD dependency) ---------------------------------
    // Compiled against, and required at runtime. See the notes in
    // gradle.properties if the Maven coordinates fail to resolve.
    if (project.use_maven_tan.toBoolean()) {
        compileOnly "com.github.glitchfiend:ToughAsNails-neoforge:${minecraft_version}-${toughasnails_version}"
        compileOnly "com.github.glitchfiend:GlitchCore-neoforge:${minecraft_version}-${glitchcore_version}"
        localRuntime "com.github.glitchfiend:ToughAsNails-neoforge:${minecraft_version}-${toughasnails_version}"
        localRuntime "com.github.glitchfiend:GlitchCore-neoforge:${minecraft_version}-${glitchcore_version}"
    }

    // Anything dropped into ./libs is compiled against and loaded in dev runs.
    // Empty directory == no-op, so this is safe either way.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    localRuntime fileTree(dir: 'libs', include: ['*.jar'])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
