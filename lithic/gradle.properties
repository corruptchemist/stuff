# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (human-readable parameter names). See https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
# Versions taken verbatim from the official NeoForge MDK for 1.21.1.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
neo_version_range=[21.1.0,)
loader_version_range=[1,)

## Mod properties
mod_id=lithic
mod_name=Lithic
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.corruptchemist.lithic
mod_authors=corruptchemist
mod_description=A deliberately brutal progression overhaul. Nothing is crafted until it is understood.

## Dependencies
#
# Tough As Nails is a HARD dependency of Lithic.
#
# !! VERIFY THIS VERSION BEFORE YOUR FIRST BUILD !!
# The Glitchfiend team derive their published version from git tags, and their
# Maven (https://maven.minecraftforge.net/releases) could not be reached from the
# environment this project was generated in, so the exact 1.21.1 artifact version
# could NOT be confirmed. Two ways to fix it if the build fails to resolve:
#
#   a) Browse
#      https://maven.minecraftforge.net/releases/com/github/glitchfiend/ToughAsNails-neoforge/
#      and set toughasnails_version to the 1.21.1-* artifact you want, or
#   b) Set use_maven_tan=false and drop the ToughAsNails + GlitchCore jars you
#      actually run into ./libs/ instead. That path needs no version at all.
#
# glitchcore_version is NOT a guess: it is what Tough As Nails' own 1.21.1 branch
# pins in its gradle.properties.
use_maven_tan=true
toughasnails_version=10.2.0
glitchcore_version=2.1.0.0
