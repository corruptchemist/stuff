# Forge 1.20.1 applies access transformers against SRG names, NOT the Mojang names
# that NeoForge 1.21.1 accepted. Both fields below are net.minecraft.client.renderer.BiomeColors.
#   GRASS_COLOR_RESOLVER   -> f_108790_
#   FOLIAGE_COLOR_RESOLVER -> f_108789_
# VERIFY these two SRG ids against your 1.20.1 mappings before trusting the build; if they are
# wrong the AT silently matches nothing and BiomeColors stays package-private.
public-f net.minecraft.client.renderer.BiomeColors f_108790_ # GRASS_COLOR_RESOLVER
public-f net.minecraft.client.renderer.BiomeColors f_108789_ # FOLIAGE_COLOR_RESOLVER
